name: Coverage Gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来对比覆盖率

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Check coverage threshold
        run: |
          node -e "
            const data = require('./coverage/coverage-final.json');
            let total = 0, covered = 0;
            for (const info of Object.values(data)) {
              const s = info.s || {};
              const hits = Object.values(s);
              total += hits.length;
              covered += hits.filter(v => v > 0).length;
            }
            const pct = (covered / total * 100).toFixed(1);
            if (parseFloat(pct) < 79) {
              console.error('❌ Coverage ' + pct + '% is below threshold 79%');
              process.exit(1);
            }
            console.log('✅ Coverage: ' + pct + '% (' + covered + '/' + total + ' statements)');
          "

      - name: Check coverage not decreased (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # 纯删除误伤豁免：删掉高覆盖死代码会同减分子分母、拉低总覆盖率
          #（2026-08-19 PR #64 删 ConstraintInterceptor 实发：88.9%→87.5%）。
          # 统计时排除本 PR 删除的文件，只比较两边都存在的文件；
          # 新增文件仍计入 PR 侧（新代码必须带测试，不受豁免）。
          export DELETED_FILES=$(git diff --name-only --diff-filter=D ${{ github.base_ref }}...HEAD)
          cov() { node -e "
            const path=require('path');
            const del=(process.env.DELETED_FILES||'').split('\n').filter(Boolean);
            const data=require('./coverage/coverage-final.json');
            let t=0,c=0;
            for(const [f,i] of Object.entries(data)){
              if(del.includes(path.relative(process.cwd(),f)))continue;
              const s=i.s||{};const h=Object.values(s);t+=h.length;c+=h.filter(v=>v>0).length;
            }
            console.log((c/t*100).toFixed(1));
          "; }
          git checkout ${{ github.base_ref }}
          npm ci
          # 基线只取覆盖率、不门禁 master 测试（PR 头测试已由上一步严格门禁）：
          # master 红（如时间炸弹测试）时硬失败会死锁所有 PR——包括正在修
          # 那个失败测试的 PR 本身（2026-08-04 PR #14 实发）
          npm test -- --coverage || true
          BASE_COVERAGE=$(cov)
          git checkout -
          npm ci && npm test -- --coverage
          PR_COVERAGE=$(cov)
          echo "Base coverage: $BASE_COVERAGE% (excludes PR-deleted files)"
          echo "PR coverage: $PR_COVERAGE%"
          DECREASE=$(echo "$BASE_COVERAGE - $PR_COVERAGE" | bc)
          if (( $(echo "$DECREASE > 1" | bc -l) )); then
            echo "❌ Coverage decreased by $DECREASE%"
            exit 1
          fi
          echo "✅ Coverage check passed"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # lint 曾长期无 CI 覆盖（issue #35）：仓库自初始提交起无 ESLint 配置，命令恒失败却从未被 CI 暴露。
  # 本 job 保证 npm run lint 持续全绿，防再退化。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
