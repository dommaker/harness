name: Harness Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Constraint check
        run: node bin/harness.js check

      - name: Quality gate
        run: node bin/harness.js passes-gate

      # 顺序约束：写入必须在校验之前——sync-docs 会自愈 CAPABILITIES.md 幽灵条目并给缺登记补行，
      # check 若跑在写入前，幽灵会先撞 check（2026-08-08 CI 4 连红结论，不回退）。
      - name: Sync docs (heal ghosts, auto-register)
        run: node bin/harness.js sync-docs

      # 仓库级漏登门（harness#120 方案 A）：写入后 CAPABILITIES.md 有 diff = HEAD 文档过期。
      # 自愈照做，但「需要自愈」本身成为门；diff 新增行即缺登记文件名单。
      - name: Gate on stale CAPABILITIES.md
        run: |
          if ! git diff --exit-code CAPABILITIES.md; then
            echo "::error::CAPABILITIES.md 已过期：上方 diff 的新增/删除行即未同步的登记变更。请本地跑 node bin/harness.js sync-docs 并提交结果。"
            exit 1
          fi

      # CONTEXT.md 门（harness#142）：散文不可机械生成，走 --check 直接判红并点名文件与符号，
      # 不套上面的「写入 + diff 门」。mtime 判定在 CI 里已抑制（全新 checkout 的时序无意义），
      # 判红只来自「核心导出」节与目录导出面的内容漂移。
      - name: Gate on stale CONTEXT.md
        run: node bin/harness.js sync-docs --check

  # P1-8（ADR-0031，wayfinder 票08）：全历史机密扫描。fetch-depth: 0 取全历史；
  # 固定版本安装 gitleaks 后跑 `harness security secrets`——与本地同一命令同一判定口径
  # （本地二进制缺失是 skip，CI 安装后才是真门）。
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Secrets scan (full history)
        run: node bin/harness.js security secrets
